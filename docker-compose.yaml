name: gobabygo
services:
  proxy:
    image: "nginx:1.31"
    env_file: .env
    ports:
      - "8888:80"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - webpack

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: gobabygo
    ports:
      - ":8000"
    env_file: .env
    command: "uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/opt/src

  worker:
    image: gobabygo
    env_file: .env
    command: "celery -A app.celery_conf worker -B --loglevel=info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/opt/src

  webpack:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: gobabygo-frontend
    ports:
      - ":8080"
    command: "npm run-script start"
    volumes:
      - ./:/opt/src

  db:
    image: "postgres:18"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    env_file: .env
    ports:
      - ":5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: "redis:8"
    env_file: .env
    ports:
      - ":6379"

volumes:
  postgres-data:
