server {
    listen 80;
    server_name localhost;

    location /webpack-dist/ {
        proxy_pass http://gobabygo-webpack-1:8080/webpack-dist/;
    }

    location /webpack-ws {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;

        proxy_pass http://gobabygo-webpack-1:8080/ws;

        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /mcp {
        proxy_pass http://gobabygo-web-1:8000/mcp;

        # Forward the original Host: the MCP transport validates it against
        # ALLOWED_HOSTS (see gobabygo/mcp.py).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;

        # MCP streamable HTTP responds with SSE streams; don't buffer them.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /ws/ {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;

        proxy_pass http://gobabygo-web-1:8000/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://gobabygo-web-1:8000/;

        proxy_set_header X-Forwarded-Host $http_host;
    }
}
