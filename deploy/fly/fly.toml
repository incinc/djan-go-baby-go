# Run from the repository root; pass --app and --primary-region explicitly.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "app.settings.fly"

[deploy]
  release_command = "sh deploy/fly/release.sh"
  # One stateful MCP process; deployments interrupt existing sessions.
  strategy = "immediate"

[processes]
  web = "uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
  worker = "celery -A app.celery_conf worker --loglevel=info --concurrency=2"
  beat = "celery -A app.celery_conf beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile="

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/"
    [http_service.checks.headers]
      Host = "localhost"
      X-Forwarded-Proto = "https"

[[vm]]
  processes = ["web", "worker", "beat"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
